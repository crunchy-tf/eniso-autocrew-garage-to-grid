name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm: npm.cmd
          - os: macos-latest
            npm: npm
          - os: ubuntu-latest
            npm: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: ${{ matrix.npm }} ci
      - name: Type check
        run: ${{ matrix.npm }} run typecheck
      - name: Test against virtual and real Git
        run: ${{ matrix.npm }} test
      - name: Build production website
        run: ${{ matrix.npm }} run build
